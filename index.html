
<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secret11 - AI-Powered Skincare for Indian Skin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #020010;
        color: #e5e7eb;
        overflow-x: hidden;
        cursor: default;
      }
      
      /* GLOBAL NOISE TEXTURE */
      .bg-noise {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 50;
        opacity: 0.03;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }
      
      @media (min-width: 1024px) {
        body, a, button, input, select {
             cursor: none !important;
        }
      }

      /* VIBRANT GALAXY VIDEO BACKGROUND */
      .galaxy-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        background: #020010;
        overflow: hidden;
        /* Perspective is important for 3D transforms if we add them */
        perspective: 1000px;
      }

      .star-field {
        position: absolute;
        inset: -100px; /* Extend slightly to prevent clipping on scroll */
        background-image: url('https://grainy-gradients.vercel.app/noise.svg');
        opacity: 0.25;
        z-index: 10;
        pointer-events: none;
        mix-blend-mode: overlay;
        will-change: transform;
      }

      .nebula-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.6;
        mix-blend-mode: screen;
        animation: floatNebula 15s infinite ease-in-out alternate;
        will-change: transform;
      }

      /* Orbs Configuration */
      .orb-1 { top: -10%; left: -10%; width: 70vw; height: 70vw; background: radial-gradient(circle, #7c3aed 0%, transparent 70%); animation-duration: 25s; }
      .orb-2 { bottom: -20%; right: -10%; width: 80vw; height: 80vw; background: radial-gradient(circle, #2563eb 0%, transparent 70%); animation-duration: 30s; animation-direction: alternate-reverse; }
      .orb-3 { top: 30%; left: 40%; width: 50vw; height: 50vw; background: radial-gradient(circle, #db2777 0%, transparent 70%); opacity: 0.5; animation-duration: 20s; }
      .orb-4 { bottom: 10%; left: 10%; width: 40vw; height: 40vw; background: radial-gradient(circle, #06b6d4 0%, transparent 70%); opacity: 0.5; animation-duration: 35s; }
      .orb-5 { top: 50%; right: 20%; width: 30vw; height: 30vw; background: radial-gradient(circle, #10b981 0%, transparent 70%); opacity: 0.4; animation-duration: 28s; }
      .orb-6 { top: 10%; right: 10%; width: 35vw; height: 35vw; background: radial-gradient(circle, #f97316 0%, transparent 70%); opacity: 0.3; animation-duration: 40s; }
      .orb-7 { bottom: 40%; left: -20%; width: 60vw; height: 60vw; background: radial-gradient(circle, #4f46e5 0%, transparent 70%); opacity: 0.4; animation-duration: 45s; }

      @keyframes floatNebula {
        0% { transform: translate(0, 0) scale(1) rotate(0deg); }
        33% { transform: translate(50px, -30px) scale(1.1) rotate(5deg); }
        66% { transform: translate(-30px, 40px) scale(0.95) rotate(-5deg); }
        100% { transform: translate(20px, -20px) scale(1.05) rotate(3deg); }
      }
      
      ::selection { background: rgba(219, 39, 119, 0.5); color: #ffffff; }
      
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #020010; }
      ::-webkit-scrollbar-thumb { background: linear-gradient(to bottom, #3b82f6, #9333ea); border-radius: 4px; border: 2px solid #020010; }
      
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
      
      .glass-panel {
        background: rgba(15, 23, 42, 0.3);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      
      .text-gradient {
        background: linear-gradient(135deg, #22d3ee 0%, #3b82f6 25%, #d946ef 50%, #f472b6 75%, #facc15 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        color: transparent;
        background-size: 200% auto;
        animation: gradient-x 5s linear infinite;
      }
      
      .animate-gradient-x { background-size: 200% 200%; animation: gradient-x 6s ease infinite; }
      @keyframes gradient-x { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

      .bg-grid {
        background-size: 40px 40px;
        background-image: linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      }
      
      .cursor-wait { cursor: wait; }
      
      .animate-fade-in-up { animation: fadeInUp 0.8s ease-out forwards; opacity: 0; transform: translateY(20px); }
      .delay-100 { animation-delay: 0.1s; }
      .delay-200 { animation-delay: 0.2s; }
      .delay-300 { animation-delay: 0.3s; }
      
      @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
      
      @keyframes scan { 0% { top: 0%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }

      .page-enter { animation: pageEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      @keyframes pageEnter { from { opacity: 0; transform: translateY(10px) scale(0.99); filter: blur(5px); } to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }

      @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
      .animate-marquee { animation: marquee 30s linear infinite; }

      .glitch-hover:hover { animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite; color: #fff; }
      @keyframes glitch { 0% { transform: translate(0) } 20% { transform: translate(-2px, 2px) } 40% { transform: translate(-2px, -2px) } 60% { transform: translate(2px, 2px) } 80% { transform: translate(2px, -2px) } 100% { transform: translate(0) } }
      
      @keyframes float-molecule { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(0, -10px); } }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.10.1",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "vite": "https://aistudiocdn.com/vite@^7.2.6",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0"
  }
}
</script>
</head>
  <body>
    <div class="bg-noise"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
